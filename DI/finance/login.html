<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 1rem;
            animation: fadeIn 0.8s ease;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
    </style>
</head>

<body class="dark-theme">

    <div class="login-container">
        <div class="login-card">
            <div class="logo" style="justify-content:center; font-size:2rem; margin-bottom:1rem">
                <i class="ri-wallet-3-fill"></i> FinanceFlow
            </div>
            <h2 id="authTitle" style="margin-bottom:0.5rem; font-weight:700">Bienvenido</h2>
            <p id="authSubtitle" style="color:var(--text-muted); margin-bottom:2.5rem">Gestiona tu capital con
                inteligencia</p>

            <form id="authForm">
                <div class="input-group">
                    <i class="ri-user-line"></i>
                    <input type="text" id="username" placeholder="Usuario o Email" required>
                </div>
                <div class="input-group">
                    <i class="ri-lock-line"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; padding:1.2rem; margin-top:1rem">
                    <span id="btnText">Iniciar Sesión</span>
                </button>
            </form>

            <p style="margin-top:2rem; font-size:0.9rem">
                <span id="switchText">¿No tienes cuenta?</span>
                <a href="#" id="switchAuthMode"
                    style="color:var(--primary); font-weight:600; text-decoration:none">Regístrate</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
        const authForm = document.getElementById('authForm');
        const switchBtn = document.getElementById('switchAuthMode');
        let isLogin = true;

        switchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? 'Bienvenido' : 'Crear Cuenta';
            document.getElementById('btnText').innerText = isLogin ? 'Iniciar Sesión' : 'Registrarse';
            document.getElementById('switchText').innerText = isLogin ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?';
            switchBtn.innerText = isLogin ? 'Regístrate' : 'Inicia Sesión';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userInput = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = userInput.includes('@') ? userInput : `${userInput}@financeflow.local`;

            try {
                let result;
                if (window.sbClient) {
                    if (isLogin) {
                        result = await window.sbClient.auth.signInWithPassword({ email, password });
                    } else {
                        result = await window.sbClient.auth.signUp({
                            email,
                            password,
                            options: { data: { username: userInput } }
                        });
                    }
                    if (result.error) throw result.error;

                    if (result.data.user) {
                        localStorage.setItem('finance_session', JSON.stringify(result.data.user));
                        // Create profile if new sign up
                        if (!isLogin) {
                            await window.sbClient.from('profiles').insert({ id: result.data.user.id, total_balance: 0 });
                        }
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    // Offline Support
                    const mockUser = { id: 'offline-' + Date.now(), email, user_metadata: { username: userInput } };
                    localStorage.setItem('finance_session', JSON.stringify(mockUser));
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            }
        });
    </script>
</body>

</html>
