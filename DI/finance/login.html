<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinanceFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="light-theme">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Bienvenido</h2>
            <p>Gestiona tu capital.</p>
            <form id="authForm">
                <div class="input-group">
                    <i class="ri-user-line"></i>
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <i class="ri-lock-line"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <p class="switch-auth">¿No tienes cuenta? <a href="#" id="switchAuthMode">Regístrate</a></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
        const authForm = document.getElementById('authForm');
        const switchBtn = document.getElementById('switchAuthMode');
        let isLogin = true;

        switchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            document.querySelector('h2').innerText = isLogin ? 'Bienvenido' : 'Crear Cuenta';
            authForm.querySelector('button').innerText = isLogin ? 'Iniciar Sesión' : 'Registrarse';
            switchBtn.innerText = isLogin ? 'Regístrate' : 'Inicia Sesión';
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = `${username}@financeflow.local`; // Dummy email

            try {
                let result;
                if (window.sbClient) {
                    if (isLogin) {
                        result = await window.sbClient.auth.signInWithPassword({ email, password });
                    } else {
                        result = await window.sbClient.auth.signUp({
                            email,
                            password,
                            options: { data: { username } }
                        });
                    }
                    if (result.error) throw result.error;

                    if (result.data.user) {
                        localStorage.setItem('finance_session', JSON.stringify(result.data.user));
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    // Offline Mock
                    const mockUser = { id: 'offline', email: email, user_metadata: { username } };
                    localStorage.setItem('finance_session', JSON.stringify(mockUser));
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>

</html>
