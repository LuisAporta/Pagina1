<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacciones - FinanceFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" crossorigin href="./assets/login-BbQ7D4MZ.css">
</head>

<body class="dark-theme">

    <div id="app">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div>
                    <div
                        style="background: linear-gradient(to right, var(--text), var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                        <h1>Transacciones</h1>
                    </div>
                    <p style="color:var(--text-muted)">Gestiona tus movimientos financieros</p>
                </div>
                <button class="btn-primary" onclick="openModal()">
                    <i class="ri-add-circle-line"></i> Nueva Operación
                </button>
            </header>

            <div class="stat-card"
                style="margin-bottom: 2rem; border: none; background: rgba(255,255,255,0.02); padding: 1rem 1.5rem;">
                <div class="filters" style="display:flex; gap:1rem; align-items:center">
                    <div class="input-group" style="margin-bottom:0; flex:2;">
                        <i class="ri-search-line"></i>
                        <input type="text" id="searchInput" placeholder="Buscar por concepto..."
                            onkeyup="filterTransactions()">
                    </div>
                    <div style="flex:1;">
                        <select id="filterType" onchange="filterTransactions()">
                            <option value="all">Todos</option>
                            <option value="income">Ingresos</option>
                            <option value="expense">Gastos</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="transactions-list" id="transactionsList">
                <p style="padding:2rem; text-align:center; opacity:0.5">Sincronizando con la nube...</p>
            </div>
        </main>

        <nav class="mobile-nav"></nav>
    </div>

    <!-- Modal -->
    <div id="transactionModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()"
                style="position:absolute; right:1.5rem; top:1.5rem; cursor:pointer; font-size:1.5rem">&times;</span>
            <h2 id="modalTitle" style="margin-bottom:2rem; font-weight: 700;">Nueva Operación</h2>
            <form id="transactionForm">
                <input type="hidden" id="txId">

                <span class="input-label">Tipo de Movimiento</span>
                <div class="segmented-control">
                    <label>
                        <input type="radio" name="type" value="income" checked>
                        <span><i class="ri-add-line"></i> Ingreso</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="expense">
                        <span><i class="ri-subtract-line"></i> Gasto</span>
                    </label>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem">
                    <div>
                        <span class="input-label">Monto (€)</span>
                        <div class="input-group">
                            <i class="ri-money-euro-circle-line"></i>
                            <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                        </div>
                    </div>
                    <div>
                        <span class="input-label">Categoría</span>
                        <select id="category">
                            <option value="salary">Salario</option>
                            <option value="food">Alimentación</option>
                            <option value="transport">Transporte</option>
                            <option value="leisure">Ocio/Cine</option>
                            <option value="shopping">Compras</option>
                            <option value="health">Salud</option>
                            <option value="services">Suministros</option>
                            <option value="other">Otros</option>
                        </select>
                    </div>
                </div>

                <span class="input-label">Fecha del Movimiento</span>
                <div class="input-group">
                    <i class="ri-calendar-line"></i>
                    <input type="date" id="date" required>
                </div>

                <span class="input-label">Descripción</span>
                <div class="input-group">
                    <i class="ri-chat-3-line"></i>
                    <input type="text" id="description" placeholder="Ej: Supermercado, Alquiler..." required>
                </div>

                <span class="input-label">Comprobante (Opcional)</span>
                <div class="input-group">
                    <div class="custom-file-upload">
                        <input type="file" id="fileUpload">
                        <div class="file-dummy">
                            <i class="ri-upload-2-line"></i>
                            <span id="fileNameDisplay">Seleccionar archivo o arrastra aquí</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; padding:1.2rem; margin-top:1rem">
                    <i class="ri-save-line"></i> <span id="saveBtnText">Guardar Operación</span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js?v=2.0"></script>
    <script>
        setupNavigation('transactions');
        requireAuth();

        let transactions = [];
        const modal = document.getElementById('transactionModal');

        document.addEventListener('DOMContentLoaded', () => {
            // Set default date to today
            document.getElementById('date').valueAsDate = new Date();
            loadTransactions();
        });

        async function loadTransactions() {
            const user = JSON.parse(localStorage.getItem('finance_session'));
            const localData = localStorage.getItem('finance_transactions');
            if (localData) transactions = JSON.parse(localData);

            if (window.sbClient && user) {
                const { data } = await window.sbClient
                    .from('transactions')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('date', { ascending: false });

                if (data) {
                    transactions = data;
                    localStorage.setItem('finance_transactions', JSON.stringify(transactions));
                }
            }
            renderList(transactions);
        }

        function renderList(list) {
            const container = document.getElementById('transactionsList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div style="background:var(--card); padding:3rem; border-radius:24px; text-align:center; border:1px dashed var(--border)"><i class="ri-inbox-line" style="font-size:3rem; opacity:0.2"></i><p style="margin-top:1rem; opacity:0.5">No hay movimientos registrados.</p></div>';
                return;
            }

            list.forEach(tx => {
                const div = document.createElement('div');
                div.className = `transaction-item`;
                const amountColor = tx.type === 'income' ? 'var(--success)' : 'var(--danger)';
                const icon = tx.type === 'income' ? 'ri-arrow-left-down-line' : 'ri-arrow-right-up-line';

                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:1.5rem">
                        <div style="width:45px; height:45px; border-radius:12px; background:${amountColor}20; color:${amountColor}; display:flex; align-items:center; justify-content:center; font-size:1.5rem">
                            <i class="${icon}"></i>
                        </div>
                        <div class="t-info">
                            <span class="t-title">${tx.description}</span>
                            <span class="t-date"><i class="ri-calendar-event-line"></i> ${new Date(tx.date).toLocaleDateString()} • <span style="text-transform:capitalize">${tx.category}</span></span>
                            ${tx.file_url ? `<a href="${tx.file_url}" target="_blank" style="font-size:0.75rem; color:var(--primary); text-decoration:none"><i class="ri-file-list-3-line"></i> Ver comprobante</a>` : ''}
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:1.5rem">
                        <span class="t-amount" style="color:${amountColor}">${tx.type === 'income' ? '+' : '-'} €${tx.amount.toLocaleString()}</span>
                        <div style="display:flex; gap:0.5rem">
                            <button onclick="editTx('${tx.id}')" class="nav-btn" style="padding:0.5rem"><i class="ri-edit-line"></i></button>
                            <button onclick="deleteTx('${tx.id}')" class="nav-btn" style="padding:0.5rem; color:var(--danger)"><i class="ri-delete-bin-7-line"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const user = JSON.parse(localStorage.getItem('finance_session'));
            const fileInput = document.getElementById('fileUpload');

            const tx = {
                user_id: user.id,
                type: document.querySelector('input[name="type"]:checked').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            if (fileInput.files.length > 0 && window.sbClient) {
                const file = fileInput.files[0];
                const fileName = `${user.id}/${Date.now()}_${file.name}`;
                const { data, error } = await window.sbClient.storage.from('receipts').upload(fileName, file);
                if (!error) {
                    const { data: { publicUrl } } = window.sbClient.storage.from('receipts').getPublicUrl(fileName);
                    tx.file_url = publicUrl;
                }
            }

            if (id) {
                if (window.sbClient) await window.sbClient.from('transactions').update(tx).eq('id', id);
            } else {
                if (window.sbClient) await window.sbClient.from('transactions').insert(tx);
            }

            closeModal();
            loadTransactions();
        });

        async function deleteTx(id) {
            if (!confirm('¿Estás seguro de eliminar este movimiento financiero?')) return;
            if (window.sbClient) await window.sbClient.from('transactions').delete().eq('id', id);
            loadTransactions();
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            document.getElementById('txId').value = tx.id;
            document.getElementById('amount').value = tx.amount;
            document.getElementById('description').value = tx.description;
            document.getElementById('category').value = tx.category;
            document.getElementById('date').value = tx.date.split('T')[0];
            document.querySelector(`input[name="type"][value="${tx.type}"]`).checked = true;
            document.getElementById('modalTitle').innerText = 'Editar Movimiento';
            openModal();
        }

        window.filterTransactions = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const filtered = transactions.filter(t => {
                const matchesSearch = t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                const matchesType = type === 'all' || t.type === type;
                return matchesSearch && matchesType;
            });
            renderList(filtered);
        };

        window.openModal = () => {
            document.getElementById('transactionForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('txId').value = '';
            document.getElementById('modalTitle').innerText = 'Nueva Operación';
            document.getElementById('fileNameDisplay').innerText = 'Seleccionar archivo o arrastra aquí';
            modal.classList.remove('hidden');
        };

        // File name display listener
        document.getElementById('fileUpload').addEventListener('change', function (e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'Seleccionar archivo o arrastra aquí';
            document.getElementById('fileNameDisplay').innerText = fileName;
        });
        window.closeModal = () => modal.classList.add('hidden');
    </script>
</body>

</html>
