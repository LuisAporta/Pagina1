<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacciones - FinanceFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="light-theme">

    <div id="app">
        <aside class="sidebar"></aside> <!-- Injected by common.js -->

        <main class="main-content">
            <header class="top-bar">
                <h1>Transacciones</h1>
                <button class="btn-primary" onclick="openModal()"><i class="ri-add-line"></i> Nuevo</button>
            </header>

            <div class="filters">
                <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterTransactions()">
                <select id="filterType" onchange="filterTransactions()">
                    <option value="all">Todos</option>
                    <option value="income">Ingresos</option>
                    <option value="expense">Gastos</option>
                </select>
            </div>

            <div class="transactions-list" id="transactionsList">
                <!-- Dynamic Content -->
                <p style="padding:1rem">Cargando...</p>
            </div>
        </main>

        <nav class="mobile-nav"></nav> <!-- Injected by common.js -->
    </div>

    <!-- Modal -->
    <div id="transactionModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Nueva Transacción</h2>
            <form id="transactionForm">
                <input type="hidden" id="txId">
                <div class="form-group">
                    <label>Tipo</label>
                    <div class="type-selector">
                        <label><input type="radio" name="type" value="income" checked> Ingreso</label>
                        <label><input type="radio" name="type" value="expense"> Gasto</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Monto (€)</label>
                    <input type="number" step="0.01" id="amount" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" id="description" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="category">
                        <option value="salary">Salario</option>
                        <option value="food">Comida</option>
                        <option value="transport">Transporte</option>
                        <option value="leisure">Ocio</option>
                        <option value="other">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Adjunto (Imagen/PDF)</label>
                    <input type="file" id="fileUpload">
                </div>
                <button type="submit" class="btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
        setupNavigation('transactions');
        requireAuth();

        let transactions = [];
        const modal = document.getElementById('transactionModal');

        // Initial Load
        document.addEventListener('DOMContentLoaded', loadTransactions);

        async function loadTransactions() {
            const user = JSON.parse(localStorage.getItem('finance_session'));

            // Try LocalStorage first
            const localData = localStorage.getItem('finance_transactions');
            if (localData) transactions = JSON.parse(localData);

            // Sync with Supabase
            if (window.sbClient && user) {
                const { data, error } = await window.sbClient
                    .from('transactions')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('date', { ascending: false });

                if (data) {
                    transactions = data;
                    localStorage.setItem('finance_transactions', JSON.stringify(transactions));
                }
            }
            renderList(transactions);
        }

        function renderList(list) {
            const container = document.getElementById('transactionsList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<p style="padding:1rem; text-align:center;">No hay transacciones.</p>';
                return;
            }

            list.forEach(tx => {
                const div = document.createElement('div');
                div.className = `transaction-item ${tx.type}`;
                div.innerHTML = `
                    <div class="t-info">
                        <span class="t-title">${tx.description}</span>
                        <span class="t-date">${new Date(tx.date).toLocaleDateString()} - ${tx.category}</span>
                        ${tx.file_url ? `<a href="${tx.file_url}" target="_blank" style="font-size:0.8rem; color:var(--primary-color)">Ver Adjunto</a>` : ''}
                    </div>
                    <div>
                        <span class="t-amount" style="margin-right:1rem">${tx.type === 'income' ? '+' : '-'}€${tx.amount}</span>
                        <button onclick="editTx('${tx.id}')" style="background:none; border:none; cursor:pointer;"><i class="ri-pencil-line"></i></button>
                        <button onclick="deleteTx('${tx.id}')" style="background:none; border:none; cursor:pointer; color:var(--danger-color)"><i class="ri-delete-bin-line"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // CRUD
        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const user = JSON.parse(localStorage.getItem('finance_session'));
            const fileInput = document.getElementById('fileUpload');

            // Build Object
            const tx = {
                user_id: user.id,
                type: document.querySelector('input[name="type"]:checked').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                date: new Date().toISOString()
            };

            // Handle File
            if (fileInput.files.length > 0 && window.sbClient) {
                const file = fileInput.files[0];
                const fileName = `${user.id}/${Date.now()}_${file.name}`;
                const { data, error } = await window.sbClient.storage.from('receipts').upload(fileName, file);

                if (!error) {
                    const { data: { publicUrl } } = window.sbClient.storage.from('receipts').getPublicUrl(fileName);
                    tx.file_url = publicUrl;
                } else {
                    console.error("Upload error:", error);
                    alert("Error subiendo archivo (asegúrate de crear el bucket 'receipts' público)");
                }
            }

            if (id) {
                // Update
                if (window.sbClient) await window.sbClient.from('transactions').update(tx).eq('id', id);
                // Local Update logic omitted for brevity, assuming reload or simple object update
            } else {
                // Create
                if (window.sbClient) await window.sbClient.from('transactions').insert(tx);
            }

            closeModal();
            loadTransactions(); // Refresh
        });

        async function deleteTx(id) {
            if (!confirm('¿Borrar transacción?')) return;
            if (window.sbClient) await window.sbClient.from('transactions').delete().eq('id', id);

            // Local fallback
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('finance_transactions', JSON.stringify(transactions));
            loadTransactions();
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;

            document.getElementById('txId').value = tx.id;
            document.getElementById('amount').value = tx.amount;
            document.getElementById('description').value = tx.description;
            document.getElementById('category').value = tx.category;
            document.querySelector(`input[name="type"][value="${tx.type}"]`).checked = true;
            document.getElementById('modalTitle').innerText = 'Editar Transacción';

            openModal();
        }

        // Search & Filter
        window.filterTransactions = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;

            const filtered = transactions.filter(t => {
                const matchesSearch = t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                const matchesType = type === 'all' || t.type === type;
                return matchesSearch && matchesType;
            });
            renderList(filtered);
        };

        window.openModal = () => {
            document.getElementById('transactionForm').reset();
            document.getElementById('txId').value = '';
            document.getElementById('modalTitle').innerText = 'Nueva Transacción';
            modal.classList.remove('hidden');
        };

        window.closeModal = () => modal.classList.add('hidden');
    </script>
</body>

</html>
