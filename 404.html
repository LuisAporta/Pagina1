<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    <script>
        // Fix Case Sensitivity: Pagina1 -> pagina1
        var path = window.location.pathname;
        if (path.includes('/Pagina1')) {
            var newPath = path.replace('/Pagina1', '/pagina1');
            window.location.replace(newPath);
        } else if (path.includes('/ASI/')) {
            var newPath = path.replace('/ASI/', '/asi/');
            window.location.replace(newPath);
        }
    </script>
    <style>
        body {
            background: #000;
            color: #0ff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        a {
            color: #fff;
        }
    </style>
</head>

<body>
    <div style="text-align: center;">
        <h1>404 - Ruta no encontrada</h1>
        <p>Intentando corregir ruta...</p>
        <p>Si no carga, usa el enlace seguro:</p>
        <a href="https://LuisAporta.github.io/pagina1/">Ir al Inicio Correcto</a>
    </div>
</body>

</html>
